<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PokéDex Overlay</title>
  <link rel="stylesheet" href="style.css">
  <style>
  </style>
</head>

<body>
  <div class="wrap">
    <div class="event-stage">
      <div id="card" class="card">
        <div class="spawn-identity">
          <div class="title" id="name">Pokémon</div>
          <span id="rarity" class="rarity-pill">RARITY</span>
        </div>
        <div class="img"><img id="sprite" alt="" /></div>
        <div class="spawn-action">
          <span class="timer-pill">⏱ <span class="timer" id="timer">60</span> s</span>
          <div class="hint"><span class="catch-pokeball" aria-hidden="true"></span>Tippe <b>!catch</b> um teilzunehmen</div>
        </div>
      </div>
      <div id="raid-card" class="raid-overlay" style="display:none;">
        <div class="raid-panel">
          <div class="raid-content">
            <div class="raid-left">
              <div id="raidBossName" class="raid-title">RAIDBOSS</div>

            <div class="raid-meta">
              <span id="raidTier" class="raid-pill tier-easy">EASY</span>
              <span id="raidCountdown" class="raid-time">90s</span>
            </div>

            <div class="raid-bar-wrap">
              <div class="raid-bar-bg">
                <div id="raidBarFill" class="raid-bar-fill"></div>
              </div>
              <!-- optional klein unten/innen -->
              <!-- <div id="raidBarText" class="raid-bar-text">0 / 80</div> -->
            </div>

            <div class="raid-join-hint">!raid join</div>
          </div>

            <div class="raid-right">
              <img id="raidBossImage" class="raid-boss-img" alt="Raidboss" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


<script>
(() => {
  // =========================
  // SPAWN DOM
  // =========================
  const spawn = {
    card: document.getElementById("card"),
    sprite: document.getElementById("sprite"),
    name: document.getElementById("name"),
    rarity: document.getElementById("rarity"),
    timer: document.getElementById("timer"),
  };

  // =========================
  // RAID DOM (dein kompaktes Layout)
  // =========================
  const raid = {
    card: document.getElementById("raid-card"),
    panel: document.querySelector("#raid-card .raid-panel"),
    tier: document.getElementById("raidTier"),
    bossName: document.getElementById("raidBossName"),
    countdown: document.getElementById("raidCountdown"),
    barFill: document.getElementById("raidBarFill"),
    bossImage: document.getElementById("raidBossImage"),
  };

  // =========================
  // STATE
  // =========================
  let lastSpawnKey = "";
  let lastRaidFetch = null; // { current, serverNow }
  let lastServerNow = 0;
  let lastClientNow = 0;
  let raidVisible = false;
  const SPRITE_STAGE = {
    anchorX: 1000,
    anchorY: 452,
    targetSize: 150,
    maxScale: 3,
    // Animierte Gen-5-GIFs koennen in spaeteren Frames deutlich breiter
    // werden als in dem Frame, den Canvas beim Laden vermisst.
    animatedEnvelopeHalfWidth: 150,
    identityGap: 24
  };

  // =========================
  // HELPERS
  // =========================
  function approxServerNow() {
    if (!lastServerNow) return Date.now();
    return lastServerNow + (Date.now() - lastClientNow);
  }

  function slugifyGerman(s) {
    return String(s || "")
      .replace(/^✨\s*Shiny\s*/i, "")
      .replace(/♀/g, "f").replace(/♂/g, "m")
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
      .replace(/\s+/g, "-")
      .replace(/[^a-zA-Z0-9\-]/g, "")
      .toLowerCase();
  }

  function normRarity(r) {
    const v = String(r || "").toLowerCase().trim();
    if (v === "gottheit") return "gottheit";
    return v || "unknown";
  }

  function getDexId(value) {
    const dexId = Number(value?.dexId ?? value?.id ?? 0);
    return Number.isFinite(dexId) && dexId > 0 ? dexId : 0;
  }

  function findVisibleBounds(img) {
    const width = img.naturalWidth || 0;
    const height = img.naturalHeight || 0;
    if (!width || !height) return null;

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    if (!ctx) return null;

    try {
      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      const pixels = ctx.getImageData(0, 0, width, height).data;
      let left = width;
      let right = -1;
      let top = height;
      let bottom = -1;

      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          if (pixels[((y * width) + x) * 4 + 3] < 12) continue;
          if (x < left) left = x;
          if (x > right) right = x;
          if (y < top) top = y;
          if (y > bottom) bottom = y;
        }
      }

      if (right < left || bottom < top) return null;
      return { left, right, top, bottom, width, height };
    } catch (_) {
      return null;
    }
  }

  function placeVisibleSprite(img, identity) {
    const bounds = findVisibleBounds(img);
    if (!bounds) {
      img.classList.remove("sprite-measured");
      if (identity) identity.classList.remove("identity-measured");
      return;
    }

    const visibleWidth = bounds.right - bounds.left + 1;
    const visibleHeight = bounds.bottom - bounds.top + 1;
    const scale = Math.min(
      SPRITE_STAGE.maxScale,
      SPRITE_STAGE.targetSize / Math.max(visibleWidth, visibleHeight)
    );
    const visibleCenterX = (bounds.left + bounds.right + 1) / 2;
    const imageLeft = SPRITE_STAGE.anchorX - (visibleCenterX * scale);
    const imageTop = SPRITE_STAGE.anchorY - ((bounds.bottom + 1) * scale);

    img.style.setProperty("--sprite-width", `${bounds.width * scale}px`);
    img.style.setProperty("--sprite-left", `${imageLeft}px`);
    img.style.setProperty("--sprite-top", `${imageTop}px`);
    img.classList.add("sprite-measured");

    if (identity) {
      requestAnimationFrame(() => {
        const identityWidth = identity.offsetWidth || 360;
        const visibleLeft = imageLeft + (bounds.left * scale);
        const visibleTop = imageTop + (bounds.top * scale);
        const visibleHeightPx = visibleHeight * scale;
        const animationSafeLeft = SPRITE_STAGE.anchorX - SPRITE_STAGE.animatedEnvelopeHalfWidth;
        const identityRight = Math.min(visibleLeft, animationSafeLeft) - SPRITE_STAGE.identityGap;
        const left = Math.max(24, identityRight - identityWidth);
        const top = Math.max(24, visibleTop + (visibleHeightPx - identity.offsetHeight) / 2);
        identity.style.setProperty("--identity-left", `${left}px`);
        identity.style.setProperty("--identity-top", `${top}px`);
        identity.classList.add("identity-measured");
      });
    }
  }

  function setGen5Sprite(img, dexId, shiny, legacyUrl, identity) {
    if (!img) return;
    const variant = shiny ? "shiny/" : "";
    const candidates = dexId ? [
      ...(shiny ? [] : [`/sprites/front/${dexId}.gif`]),
      `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${variant}${dexId}.gif`,
      `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/${variant}${dexId}.png`
    ] : [];
    if (legacyUrl) candidates.push(legacyUrl);
    candidates.push("/sprites/pokeball.png?ts=" + Date.now());

    let index = 0;
    img.classList.remove("sprite-measured");
    if (identity) identity.classList.remove("identity-measured");
    img.crossOrigin = "anonymous";
    img.onload = () => placeVisibleSprite(img, identity);
    img.onerror = () => {
      index += 1;
      if (index < candidates.length) img.src = candidates[index];
      else img.onerror = null;
    };
    img.src = candidates[index];
  }

  function applyRarityClass(el, rarity) {
    if (!el) return;
    const r = normRarity(rarity);
    for (const c of [...el.classList]) {
      if (c.startsWith("rarity-")) el.classList.remove(c);
    }
    el.classList.add(`rarity-${r}`);
  }

  function setSpawnVisible(show) {
    if (!spawn.card) return;
    if (show) spawn.card.classList.add("show");
    else spawn.card.classList.remove("show");
  }

  function setRaidVisible(show) {
    if (!raid.card) return;

    if (show && !raidVisible) {
      raid.card.style.display = "";
      raid.card.classList.add("raid-enter");
      setTimeout(() => raid.card && raid.card.classList.remove("raid-enter"), 220);
    } else if (!show && raidVisible) {
      raid.card.style.display = "none";
      raid.card.classList.remove("raid-enter");
    }

    raidVisible = show;
  }

  function asArrayParticipants(p) {
    if (!p) return [];
    if (Array.isArray(p)) return p;
    if (typeof p === "object") return Object.values(p);
    return [];
  }

  function getTier(raw) {
    return String(raw || "easy").toLowerCase();
  }

  function setTierAndTheme(tierRaw) {
    const tier = getTier(tierRaw);

    if (raid.tier) {
      [...raid.tier.classList].forEach(cls => {
        if (cls.startsWith("tier-")) raid.tier.classList.remove(cls);
      });
      raid.tier.classList.add(`tier-${tier}`);
      raid.tier.textContent = tier.toUpperCase();
    }

    if (raid.panel) {
      [...raid.panel.classList].forEach(cls => {
        if (cls.startsWith("theme-")) raid.panel.classList.remove(cls);
      });
      raid.panel.classList.add(`theme-${tier}`);
    }
  }

  function getBossName(current) {
    return current?.boss?.name || current?.pokemon?.displayName || current?.pokemon?.name || "Raidboss";
  }

  function getBossImageUrl(current) {
    // Priorität: explizite URLs
    const direct =
      current?.boss?.spriteUrl ||
      current?.boss?.artworkUrl ||
      current?.boss?.imageUrl ||
      current?.pokemon?.spriteUrl ||
      current?.pokemon?.artworkUrl ||
      current?.pokemon?.imageUrl;

    if (direct) return direct;

    // Fallback über dexId (falls vorhanden)
    let dexId = Number(
      current?.boss?.dexId ??
      current?.pokemon?.dexId ??
      0
    );

    // Extra-Fallback für ältere raidState.json-Einträge ohne dexId/spriteUrl
    if (!(Number.isFinite(dexId) && dexId > 0)) {
      const keyify = (s) => String(s || "")
        .toLowerCase()
        .replace(/[_-](easy|normal|hard|epic|legendary)$/i, "")
        .replace(/[^a-z0-9]/g, "");

      const bossIdKey = keyify(current?.boss?.id);
      const bossNameKey = keyify(current?.boss?.name || current?.pokemon?.displayName || current?.pokemon?.name);

      const map = {
        raticate: 20, rattikarl: 20,
        arbok: 24,
        golbat: 42,
        kingler: 99,
        onix: 95,
        simsala: 65, alakazam: 65,
        dragoran: 149, dragonite: 149,
        garados: 130, gyarados: 130,
        mewtu: 150, mewtwo: 150,
        arktos: 144, articuno: 144
      };

      dexId = Number(map[bossIdKey] || map[bossNameKey] || 0);
    }

    if (Number.isFinite(dexId) && dexId > 0) {
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${dexId}.gif`;
    }

    return "";
  }

  function getRequiredPower(current) {
    return Number(
      current?.boss?.requiredTotalLevel ??
      current?.requiredTotalLevel ??
      current?.requiredPower ??
      0
    ) || 0;
  }

  function getJoinEndsAt(current) {
    return Number(current?.joinEndsAt ?? current?.endsAt ?? 0) || 0;
  }

  function getCurrentPower(current) {
    // Falls Backend schon fertigen Wert liefert -> bevorzugen
    const direct = Number(current?.currentPower ?? current?.totalPower);
    if (Number.isFinite(direct) && direct >= 0) return direct;

    const participants = asArrayParticipants(current?.participants);
    return participants.reduce((sum, p) => {
      return sum + Number(
        p?.power ??
        p?.levelSnapshot ??
        p?.level ??
        0
      );
    }, 0);
  }

  function normalizeRaidPayload(data) {
    // Unterstützt { current, serverNow }
    if (data && typeof data === "object" && "current" in data) {
      return {
        current: data.current || null,
        serverNow: Number(data.serverNow) || Date.now()
      };
    }

    // Unterstützt direktes Raid-Objekt in raidState.json
    if (data && typeof data === "object" && (data.boss || data.joinEndsAt || data.endsAt)) {
      return {
        current: data,
        serverNow: Date.now()
      };
    }

    return {
      current: null,
      serverNow: Date.now()
    };
  }

  // =========================
  // RAID RENDER (kompakt, HP-Bar läuft runter)
  // =========================
  function renderRaidFromState() {
    if (!raid.card) return;

    const current = lastRaidFetch?.current || null;
    if (!current) {
      setRaidVisible(false);
      return;
    }

    const joinEndsAt = getJoinEndsAt(current);
    const now = approxServerNow();
    const leftMs = Math.max(0, joinEndsAt - now);

    // Nur Join-Phase anzeigen
    if (joinEndsAt <= 0 || leftMs <= 0) {
      setRaidVisible(false);
      return;
    }

    setRaidVisible(true);

    const bossName = getBossName(current);
    const tierRaw = current?.boss?.tier || current?.tier || "easy";
    const bossImage = getBossImageUrl(current);

    const required = getRequiredPower(current);
    const currentPower = getCurrentPower(current);

    // Texte
    if (raid.bossName) {
      raid.bossName.textContent = String(bossName || "Raidboss").toUpperCase();
    }

    setTierAndTheme(tierRaw);

    if (raid.countdown) {
      const sec = Math.max(0, Math.ceil(leftMs / 1000));
      raid.countdown.textContent = `${sec}s`;
    }

    // Bild nur setzen, wenn neu (verhindert Flackern)
    if (raid.bossImage) {
      const bossDexId = getDexId(current?.boss || current?.pokemon);
      const spriteKey = `${bossDexId}|${bossImage}`;
      if ((bossDexId || bossImage) && raid.bossImage.dataset.src !== spriteKey) {
        setGen5Sprite(raid.bossImage, bossDexId, false, bossImage, document.querySelector("#raid-card .raid-left"));
        raid.bossImage.dataset.src = spriteKey;
      }
      // kein hartes Leeren, damit's nicht blinkt
    }

    // HP-Bar soll RUNTERGEHEN:
    // Start = 100%, bei genügend Power -> 0%
    const clamped = Math.max(0, Math.min(currentPower, required || 0));
    const remaining = Math.max(0, (required || 0) - clamped);
    const remainingPct = required > 0 ? (remaining / required) * 100 : 100;

    if (raid.barFill) {
      raid.barFill.style.width = `${remainingPct}%`;
    }
  }

  async function fetchRaidState() {
    const urls = [
      `/api/raid?ts=${Date.now()}`,
      `/raidState.json?ts=${Date.now()}`
    ];

    for (const url of urls) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) continue;
        const data = await res.json();

        const normalized = normalizeRaidPayload(data);
        lastRaidFetch = normalized;
        lastServerNow = normalized.serverNow || Date.now();
        lastClientNow = Date.now();

        renderRaidFromState();
        return;
      } catch (_) {
        // still
      }
    }

    // Falls beide Endpoints failen -> Raid ausblenden (ohne Spam)
    lastRaidFetch = { current: null, serverNow: Date.now() };
    renderRaidFromState();
  }

  // =========================
  // SPAWN RENDER
  // =========================
  async function tickSpawn() {
    if (!spawn.card) return;

    try {
      const res = await fetch(`/api/spawn?ts=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) return;

      const data = await res.json();
      const active = !!data.active && (data.endsAt || 0) > (data.serverNow || Date.now());

      // Wenn Raid sichtbar ist, Spawn-Card ausblenden (optional Priorität Raid)
      if (raidVisible) {
        setSpawnVisible(false);
        return;
      }

      if (!active) {
        lastSpawnKey = "";
        setSpawnVisible(false);
        applyRarityClass(spawn.card, "unknown");
        applyRarityClass(spawn.rarity, "unknown");
        return;
      }

      const p = data.pokemon || {};
      const remaining = Math.max(
        0,
        Math.ceil(((data.endsAt || 0) - (data.serverNow || Date.now())) / 1000)
      );

      if (spawn.timer) spawn.timer.textContent = remaining;

      const key = `${p.displayName || p.name || ""}|${data.endsAt || 0}`;
      if (key !== lastSpawnKey) {
        lastSpawnKey = key;

        if (spawn.name) spawn.name.textContent = p.displayName || p.name || "???";
        if (spawn.rarity) spawn.rarity.textContent = String(p.rarity || "").toUpperCase();

        applyRarityClass(spawn.card, p.rarity);
        applyRarityClass(spawn.rarity, p.rarity);

        const slug = slugifyGerman(p.name || p.displayName);
        const localUrl = `/sprites/${slug}.png?ts=${Date.now()}`;
        const dexId = getDexId(p);

        if (spawn.sprite) {
          spawn.sprite.classList.toggle("shiny", !!p.isShiny);
          setGen5Sprite(spawn.sprite, dexId, !!p.isShiny, p.spriteUrl || localUrl, spawn.card.querySelector(".spawn-identity"));
        }

        setSpawnVisible(true);
      }
    } catch (_) {
      // still
    }
  }

  // =========================
  // START
  // =========================
  // Initial fetches
  fetchRaidState();
  tickSpawn();

  // Smooth countdown / HP UI
  setInterval(renderRaidFromState, 250);

  // Raid polling
  setInterval(fetchRaidState, 1000);

  // Spawn polling
  setInterval(tickSpawn, 400);

  // Tab zurück -> sofort refresh
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      fetchRaidState();
      tickSpawn();
    }
  });
})();
</script>
</body>

</html>
