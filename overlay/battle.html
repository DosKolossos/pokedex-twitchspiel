<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PokéDex Kampfoverlay</title>
  <link rel="stylesheet" href="battle.css">
</head>
<body>
  <main id="battle" class="battle" aria-live="polite">
    <div class="arena-glow"></div>
    <div id="trainerLeft" class="trainer-label trainer-label-left"><small>TEAM VON</small><strong>Team Blau</strong></div>
    <div id="trainerRight" class="trainer-label trainer-label-right"><small>TEAM VON</small><strong>Team Rot</strong></div>
    <div id="teamLeft" class="team-rail team-rail-left"></div>
    <div id="teamRight" class="team-rail team-rail-right"></div>
    <section id="enemyPanel" class="hp-panel hp-panel-enemy">
      <div class="hp-heading"><strong data-name>Pokémon</strong><span data-level>Lv. 1</span></div>
      <div class="status-line"><span class="status" data-status hidden></span><span class="hp-percent" data-percent>100 %</span></div>
      <div class="hp-track"><div class="hp-fill" data-fill></div></div>
      <div class="exact-hp" data-exact>0 / 0 KP</div>
    </section>
    <section id="playerPanel" class="hp-panel hp-panel-player">
      <div class="hp-heading"><strong data-name>Pokémon</strong><span data-level>Lv. 1</span></div>
      <div class="status-line"><span class="status" data-status hidden></span><span class="hp-percent" data-percent>100 %</span></div>
      <div class="hp-track"><div class="hp-fill" data-fill></div></div>
      <div class="exact-hp" data-exact>0 / 0 KP</div>
    </section>
    <div class="platform platform-enemy"></div><div class="platform platform-player"></div>
    <div id="enemyMon" class="combatant combatant-enemy"><img alt="Gegnerisches Pokémon"></div>
    <div id="playerMon" class="combatant combatant-player"><img alt="Eigenes Pokémon"></div>
    <div id="effect" class="move-effect"></div><div id="damage" class="damage-pop"></div>
    <div id="turn" class="turn-badge">KAMPFBEGINN</div>
    <div id="message" class="battle-message">Die Teams machen sich bereit …</div>
    <div id="winner" class="winner" hidden></div>
    <button id="replay" class="replay" type="button">Kampf erneut abspielen</button>
  </main>
  <script src="widget/battle-lab.js"></script><script src="battle.js"></script>
</body>
</html>
