<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PokéDex Master-Overlay</title>
  <style>
    html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    .layer { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 180ms ease; }
    .layer.is-active { opacity: 1; visibility: visible; }
  </style>
</head>
<body>
  <main aria-label="PokéDex Overlay">
    <iframe id="event-layer" class="layer" src="event.html" title="Spawn und Raid"></iframe>
    <iframe id="battle-layer" class="layer" src="battle.html" title="Ranked-Kampf"></iframe>
  </main>
  <script>
    (() => {
      const eventLayer = document.getElementById("event-layer");
      const battleLayer = document.getElementById("battle-layer");
      let visibleType = "";

      function show(type) {
        const next = type === "ranked" ? "ranked" : (["spawn", "raid"].includes(type) ? "event" : "");
        if (next === visibleType) return;
        visibleType = next;
        eventLayer.classList.toggle("is-active", next === "event");
        battleLayer.classList.toggle("is-active", next === "ranked");
      }

      async function poll() {
        try {
          const response = await fetch(`/api/overlay-event?ts=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          show(data?.event?.type || "");
        } catch (_) {
          show("");
        }
      }

      poll();
      setInterval(poll, 300);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
    })();
  </script>
</body>
</html>
