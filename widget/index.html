<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PokéDex Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <header class="topbar">
      <button class="icon-button" id="helpButton" aria-label="Hilfe">?</button>
      <div class="trainer"><span class="eyebrow">TRAINER</span><strong id="trainerName">PokéDex</strong></div>
      <button class="icon-button notification" id="notificationButton" aria-label="Benachrichtigungen">
        <span>🔔</span><b id="notificationBadge" hidden>0</b>
      </button>
    </header>
    <section id="view" class="view" aria-live="polite"></section>
    <section id="topOverlay" class="top-overlay" aria-live="polite" hidden>
      <div id="topOverlayContent" class="top-overlay-content"></div>
    </section>
    <nav class="tabs" aria-label="Hauptmenü">
      <button data-page="dex"><img src="/assets/dex-icon.png" alt="PokéDex" srcset="" style="width: 24px; height: 24px;"><small>PokéDex</small></button>
      <button data-page="pc"><img src="/assets/pc-icon.png" alt="PC" srcset="" style="width: 24px; height: 24px;"><small>PC</small></button>
      <button class="home active" data-page="home"><img src="/assets/home-icon.png" alt="Home" srcset="" style="width: 24px; height: 24px;"><small>Home</small></button>
      <button data-page="multi"><img src="/assets/multi-icon.png" alt="Multi" srcset="" style="width: 24px; height: 24px;"><small>Multi</small></button>
      <button data-page="history"><img src="/assets/history-icon.png" alt="Historie" srcset="" style="width: 24px; height: 24px;"><small>Historie</small></button>
    </nav>
  </main>
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="battle-lab.js"></script>
  <script src="app.js"></script>
</body>
</html>
